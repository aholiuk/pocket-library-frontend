<div class="auth-container">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join Pocket Library today</p>

    <div class="page-divider"></div>

    @if (errorMessage) {
      <p class="error-msg">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <p class="success-msg">{{ successMessage }}</p>
    }

    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" [(ngModel)]="firstName" placeholder="First name" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="lastName" placeholder="Last name" />
      </div>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Choose a username" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Choose a password" />
    </div>

    <button class="btn-submit" (click)="register()" [disabled]="isLoading">
      @if (isLoading) { Creating account... } @else { Create Account }
    </button>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in here</a>
    </p>
  </div>
</div>
