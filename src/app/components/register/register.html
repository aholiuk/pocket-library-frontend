<div class="auth-container">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join Pocket Library today</p>

    <div class="page-divider"></div>

    @if (errorMessage) {
      <p class="error-msg">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <p class="success-msg">{{ successMessage }}</p>
    }

  <div class="form-row">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input id="firstName" type="text" [(ngModel)]="firstName" placeholder="First name" />
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input id="lastName" type="text" [(ngModel)]="lastName" placeholder="Last name" />
    </div>
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input id="username" type="text" [(ngModel)]="username" placeholder="Choose a username" />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" [(ngModel)]="email" placeholder="Enter your email" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="password" placeholder="Choose a password" />
  </div>

    <button class="btn-submit" (click)="register()" [disabled]="isLoading">
      @if (isLoading) { Creating account... } @else { Create Account }
    </button>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in here</a>
    </p>
  </div>
</div>
